name: Validate public mobile web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/mobile-web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-public-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate deployed public UI
        env:
          TARGET_URL: https://josh-temple.github.io/systematic-trading-research/
        run: node .github/scripts/validate-public.mjs

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-validation
          path: artifacts/mobile-web-validation
          if-no-files-found: error
