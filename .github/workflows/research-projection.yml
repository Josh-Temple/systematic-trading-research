name: Validate research projection

on:
  push:
    branches: [main]
    paths:
      - "research/lines/horizontal-reaction-v0.1/**"
      - "web/**"
      - "scripts/validate_research_projection.py"
      - ".github/workflows/research-projection.yml"
  pull_request:
    paths:
      - "research/lines/horizontal-reaction-v0.1/**"
      - "web/**"
      - "scripts/validate_research_projection.py"
      - ".github/workflows/research-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate canonical records and web projection
        run: python scripts/validate_research_projection.py

      - name: Prove metric drift is detected
        shell: bash
        run: |
          cp web/data/horizontal-reaction-v0.1.js /tmp/horizontal-reaction-v0.1.js
          python - <<'PY'
          from pathlib import Path
          p = Path("web/data/horizontal-reaction-v0.1.js")
          s = p.read_text()
          old = '["Events", "4,786"]'
          new = '["Events", "4,785"]'
          if old not in s:
              raise SystemExit("mutation target not found")
          p.write_text(s.replace(old, new, 1))
          PY
          if python scripts/validate_research_projection.py; then
            echo "validator unexpectedly accepted an intentional H2 metric mismatch"
            exit 1
          fi
          mv /tmp/horizontal-reaction-v0.1.js web/data/horizontal-reaction-v0.1.js
          python scripts/validate_research_projection.py
