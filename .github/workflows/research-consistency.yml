name: Validate research and web consistency

on:
  pull_request:
    paths:
      - "research/lines/horizontal-reaction-v0.1/**"
      - "web/**"
      - "schema/v0.1/**"
      - "docs/KNOWLEDGE_BASE_V0.1.md"
      - ".github/scripts/validate-research-consistency.mjs"
      - ".github/scripts/test-research-consistency.mjs"
      - ".github/workflows/research-consistency.yml"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "research/lines/horizontal-reaction-v0.1/**"
      - "web/**"
      - "schema/v0.1/**"
      - "docs/KNOWLEDGE_BASE_V0.1.md"
      - ".github/scripts/validate-research-consistency.mjs"
      - ".github/scripts/test-research-consistency.mjs"
      - ".github/workflows/research-consistency.yml"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts

      - name: Validate canonical records and Web projection
        run: npm run check
