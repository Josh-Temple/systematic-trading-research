name: Autonomous pilot synthetic tests

on:
  push:
    paths:
      - 'research/pilots/autonomous-research-v0.1/**'
      - '.github/workflows/autonomous-pilot-phase-a.yml'
  pull_request:
    paths:
      - 'research/pilots/autonomous-research-v0.1/**'
      - '.github/workflows/autonomous-pilot-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic evaluator and Phase B mechanics tests
        working-directory: research/pilots/autonomous-research-v0.1
        run: python -m unittest -v
      - name: Run Phase A process boundary test
        working-directory: research/pilots/autonomous-research-v0.1
        run: bash run_process_boundary_test.sh
