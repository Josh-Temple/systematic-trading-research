name: FXMP independent inference audit

on:
  push:
    branches:
      - audit/fxmp-inference-20261004
    paths:
      - "research/lines/fx-monetary-policy-alignment-v0.1/**"
      - ".github/workflows/fxmp-independent-inference-audit.yml"
  pull_request:
    paths:
      - "research/lines/fx-monetary-policy-alignment-v0.1/**"
      - ".github/workflows/fxmp-independent-inference-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/lines/fx-monetary-policy-alignment-v0.1
      - name: Run independent inference audit
        run: python3 research/lines/fx-monetary-policy-alignment-v0.1/work/independent-audit-inference/audit_inference.py
