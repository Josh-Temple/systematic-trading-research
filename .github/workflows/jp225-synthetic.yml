name: JP225 pre-XM synthetic hardening
on:
  push:
    paths:
      - 'research/lines/jp225-ema-timeofday-v0.1/**'
      - '.github/workflows/jp225-synthetic.yml'
  pull_request:
    paths:
      - 'research/lines/jp225-ema-timeofday-v0.1/**'
      - '.github/workflows/jp225-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/lines/jp225-ema-timeofday-v0.1/work/integration/run_synthetic_tests.py
